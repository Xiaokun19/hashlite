name: Release

# 正式版发布：推送 v* 标签（或手动触发演练）→ 构建签名 release APK → 生成 Draft Release。
# Draft 需人工检查（真机冒烟）后手动点 Publish，才会正式公开。
#
# 需要 4 个 Actions Secrets（缺 RELEASE_KEYSTORE_B64 会直接失败）：
#   RELEASE_KEYSTORE_B64   —— release.keystore 的 base64（单行）
#   RELEASE_STORE_PASSWORD —— keystore 库密码
#   RELEASE_KEY_ALIAS      —— 密钥别名（hashlite）
#   RELEASE_KEY_PASSWORD   —— 密钥密码
# 注：fork 后想用自己的密钥发布，需替换下方 EXPECTED_SIGNER_SHA256 为本密钥指纹。
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布用 tag（演练可用测试值，如 v0.0.0-test）"
        required: true
        default: "v0.0.0-test"

# 创建 GitHub Release 需要写权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 签名 APK → Draft Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK (native 构建用，版本与本地约定一致)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null

      # 正式签名密钥只存 Actions Secrets（仓库与历史里不放任何密钥）。
      # 缺 Secret 时直接失败 —— 发布流程不允许产出未签名包。
      - name: Restore release keystore (from Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 secret is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > hashlite/release.keystore
          echo "release keystore restored"

      - name: Build signed release APK (with native keccak)
        env:
          HASHLITE_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          HASHLITE_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          HASHLITE_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :hashlite:assembleRelease -Phashlite.native=true --console=plain

      - name: Verify APK signature
        run: |
          APK=$(ls hashlite/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no signed release APK found"
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          FOUND=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'sha-256 digest' | head -1 | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')
          EXPECTED="9dfa3316325a1fa680e5a3a1f29fc500c0d01c665dfbf20bfcd71d086c64d616"
          if [ "$FOUND" != "$EXPECTED" ]; then
            echo "::error::signer fingerprint mismatch: $FOUND"
            exit 1
          fi
          echo "signature OK: $FOUND"

      - name: Prepare release assets
        run: |
          VERSION="${RELEASE_TAG#v}"
          APK=$(ls hashlite/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          cp "$APK" "hashlite-${VERSION}-arm64-v8a.apk"
          SHA=$(sha256sum "hashlite-${VERSION}-arm64-v8a.apk" | awk '{print $1}')
          cat > release-notes.md <<EOF
          ## 安装说明

          - 附件：hashlite-${VERSION}-arm64-v8a.apk，仅支持 64 位 ARM 设备（arm64-v8a，Android 7.0+）。
          - 本包为正式签名（release key）：正式版之间签名保持一致，可直接覆盖升级；若安装过 CI Artifacts / debug 版，则需先卸载再安装（应用只保存少量设置，影响很小）。
          - APK SHA-256：${SHA}

          ## 已知限制

          - 部分机型熄屏后长时间计算可能被系统冻结（已内置常亮 / 前台服务 / 唤醒锁 / 电池白名单四层手段，个别 ROM 仍无解，属已知限制）。
          - SM3 为纯软件实现（速度较慢属预期）。

          ## 更多

          - 使用说明与截图见仓库 README。
          EOF
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "HashLite ${{ env.RELEASE_TAG }}"
          draft: true
          body_path: release-notes.md
          files: hashlite-*-arm64-v8a.apk
